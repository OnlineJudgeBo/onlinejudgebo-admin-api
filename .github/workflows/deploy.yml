name: CI/CD OnlineJudge Admin API

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

  workflow_dispatch:
    inputs:
      tags:
        description: 'Tags de Cucumber, por ejemplo @contest'
        required: false
        default: ''

      env:
        description: 'Archivo application.properties'
        required: false
        default: 'dev'

      reset_db:
        description: 'Ejecutar scripts/reset-test-db.sh --yes antes de las pruebas'
        required: false
        type: boolean
        default: true

      run_selenium:
        description: 'Ejecutar pruebas Selenium antes de publicar la imagen'
        required: false
        type: boolean
        default: false

      keep_image_versions:
        description: 'Cantidad de versiones Docker a conservar en GHCR'
        required: false
        default: '3'

concurrency:
  group: admin-api-develop
  cancel-in-progress: false

jobs:
  unit-tests:
    name: Build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore OnlineJudgeAdmin.sln

      - name: Build solution
        run: |
          dotnet build OnlineJudgeAdmin.sln \
            --no-restore \
            --configuration Release

      - name: Run unit tests
        run: |
          mkdir -p TestResults

          dotnet test OnlineJudgeAdmin.sln \
            --no-restore \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=unittest-report.trx" \
            --results-directory TestResults

      - name: Generate unit test summary
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import xml.etree.ElementTree as ET

          trx_files = sorted(pathlib.Path("TestResults").glob("*.trx"))
          lines = ["## Unit test report", ""]

          if not trx_files:
              lines.append("No TRX report files were generated.")
          else:
              for trx_file in trx_files:
                  root = ET.parse(trx_file).getroot()

                  namespace = (
                      {"trx": root.tag.split("}")[0].strip("{")}
                      if root.tag.startswith("{")
                      else {}
                  )

                  counters = (
                      root.find(".//trx:Counters", namespace)
                      if namespace
                      else root.find(".//Counters")
                  )

                  if counters is None:
                      lines.append(f"- `{trx_file}`: counters not found")
                      continue

                  total = counters.attrib.get("total", "0")
                  passed = counters.attrib.get("passed", "0")
                  failed = counters.attrib.get("failed", "0")
                  skipped = counters.attrib.get("notExecuted", "0")

                  lines.append(
                      f"- `{trx_file}`: "
                      f"total={total}, "
                      f"passed={passed}, "
                      f"failed={failed}, "
                      f"skipped={skipped}"
                  )

          summary_path = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          summary_path.write_text("\n".join(lines) + "\n")
          PY

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-api-unittest-report
          path: TestResults/*.trx
          if-no-files-found: error
          retention-days: 14

  deploy-backend:
    name: Deploy backend to E2E environment
    runs-on: self-hosted
    needs:
      - unit-tests

    if: >-
      ${{
        success() &&
        github.event_name != 'pull_request' &&
        github.ref == 'refs/heads/develop'
      }}

    timeout-minutes: 20

    steps:
      - name: Pull latest backend code
        run: |
          set -euo pipefail

          cd "/home/github-runner/patito/onlineJudgeBo-admin-api"

          git fetch origin develop
          git checkout develop
          git reset --hard origin/develop

      - name: Rebuild local Docker Compose stack
        run: |
          set -euo pipefail

          cd /home/github-runner/patito

          docker compose down
          docker compose up -d --build

      - name: Show deployed services
        run: |
          cd /home/github-runner/patito
          docker compose ps

      - name: Show logs when deployment fails
        if: failure()
        run: |
          cd /home/github-runner/patito
          docker compose ps
          docker compose logs --tail=200

  run-automation-tests:
    name: Run Selenium BDD tests
    runs-on: self-hosted
    needs:
      - deploy-backend

    if: >-
      ${{
        success() &&
        github.event_name != 'pull_request' &&
        (
          github.event_name == 'push' ||
          (
            github.event_name == 'workflow_dispatch' &&
            inputs.run_selenium == true
          )
        )
      }}

    timeout-minutes: 180

    steps:
      - name: Trigger and wait for automation tests
        env:
          GH_TOKEN: ${{ secrets.PATITO_AUTOMATION_TOKEN }}
          WORKFLOW_FILE: selenium-tests.yml
          AUTOMATION_REPO: OnlineJudgeBo/patito-automation-test

          ENV_NAME: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.env || 'dev' }}

          TAGS: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.tags || '' }}

          RESET_DB: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.reset_db || true }}

        run: |
          set -euo pipefail

          echo "Capturando ejecuciones existentes..."

          BEFORE_IDS="$(
            gh run list \
              --repo "$AUTOMATION_REPO" \
              --workflow "$WORKFLOW_FILE" \
              --limit 30 \
              --json databaseId \
              --jq '.[].databaseId'
          )"

          echo "Ejecutando $WORKFLOW_FILE..."

          gh workflow run "$WORKFLOW_FILE" \
            --repo "$AUTOMATION_REPO" \
            --ref main \
            -f env="$ENV_NAME" \
            -f tags="$TAGS" \
            -f reset_db="$RESET_DB"

          echo "Buscando la nueva ejecución..."

          RUN_ID=""

          for attempt in $(seq 1 30); do
            sleep 10

            CURRENT_IDS="$(
              gh run list \
                --repo "$AUTOMATION_REPO" \
                --workflow "$WORKFLOW_FILE" \
                --limit 30 \
                --json databaseId \
                --jq '.[].databaseId'
            )"

            for id in $CURRENT_IDS; do
              if ! grep -qx "$id" <<< "$BEFORE_IDS"; then
                RUN_ID="$id"
                break 2
              fi
            done

            echo "Intento $attempt: la ejecución todavía no aparece."
          done

          if [ -z "$RUN_ID" ]; then
            echo "::error::No se pudo identificar la nueva ejecución de Selenium."
            exit 1
          fi

          echo "Ejecución encontrada: $RUN_ID"
          echo "https://github.com/$AUTOMATION_REPO/actions/runs/$RUN_ID"

          gh run watch "$RUN_ID" \
            --repo "$AUTOMATION_REPO" \
            --exit-status

  publish-image:
    name: Publish approved backend image
    runs-on: ubuntu-24.04

    needs:
      - deploy-backend
      - run-automation-tests

    if: >-
      ${{
        always() &&
        github.event_name != 'pull_request' &&
        needs.deploy-backend.result == 'success' &&
        (
          needs.run-automation-tests.result == 'success' ||
          (
            github.event_name == 'workflow_dispatch' &&
            inputs.run_selenium == false &&
            needs.run-automation-tests.result == 'skipped'
          )
        )
      }}

    env:
      IMAGE_NAME: ghcr.io/onlinejudgebo/onlinejudgebo-admin-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish approved image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:development
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cleanup-images:
    name: Cleanup old backend images
    runs-on: ubuntu-24.04
    needs:
      - publish-image

    if: >-
      ${{
        success() &&
        github.event_name != 'pull_request'
      }}

    continue-on-error: true

    steps:
      - name: Keep recent image versions
        uses: actions/delete-package-versions@v5
        with:
          owner: OnlineJudgeBo
          package-name: onlinejudgebo-admin-api
          package-type: container
          min-versions-to-keep: ${{ github.event_name == 'workflow_dispatch' && inputs.keep_image_versions || '3' }}
          
