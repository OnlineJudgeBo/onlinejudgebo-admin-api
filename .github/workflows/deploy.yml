name: OnlineJudge - admin - fron
on:
  push:
    branches:
      - develop
  pull_request:
    branches: 'develop'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

  docker-package:
    needs: build
    runs-on: ubuntu-latest
    permissions: write-all
    if: ${{github.ref == 'refs/heads/develop'}}
    steps:
    - uses: actions/checkout@v3
    - name: Login to Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build Docker images
      run: |
        docker build . --build-arg --rm -t ghcr.io/onlinejudgebo/onlinejudgebo-admin-api:development
    - name: Push Docker image to registry
      run: |
        docker push ghcr.io/onlinejudgebo/onlinejudgebo-admin-api:development

  deploy-jv-umsa-bo:
    runs-on: ubuntu-latest
    needs: docker-package
    if: ${{github.ref == 'refs/heads/develop'}}
    steps:
      - name: Setup SSH connection
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEV_SSH_SECRET }}

      - name: Adding Known Hosts
        run: ssh-keyscan -p ${{ vars.DEV_SSH_PORT }} -H ${{ vars.DEV_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Login to the GitHub Packages Docker Registry
        run: ssh -p ${{ vars.DEV_SSH_PORT }} ${{ vars.DEV_SSH_USERNAME }}@${{ vars.DEV_SSH_HOST }} "echo ${{ secrets.DOCKER_REGISTRY_TOKEN }} | docker login ghcr.io -u ${{ vars.DOCKER_REGISTRY_USER }}" --password-stdin

      - name: Run docker-compose
        continue-on-error: true
        run: ssh -p ${{ vars.DEV_SSH_PORT }} ${{ vars.DEV_SSH_USERNAME }}@${{ vars.DEV_SSH_HOST }} "cd /var/www/patito2.0/admin-api && chmod +x deploy.sh && ./deploy.sh"

      - name: Delete unused images
        run: ssh -p ${{ vars.DEV_SSH_PORT }} ${{ vars.DEV_SSH_USERNAME }}@${{ vars.DEV_SSH_HOST }} "docker image prune -f"

      - name: Logout from the GitHub Packages Docker Registry
        run: ssh -p ${{ vars.DEV_SSH_PORT }} ${{ vars.DEV_SSH_USERNAME }}@${{ vars.DEV_SSH_HOST }} "docker logout ghcr.io"

  deploy-juezvirtual:
    runs-on: ubuntu-latest
    needs: docker-package
    if: ${{github.ref == 'refs/heads/develop'}}
    steps:
      - name: Setup SSH connection
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEV_SSH_SECRET_OJ }}

      - name: Adding Known Hosts
        run: ssh-keyscan -p ${{ vars.DEV_SSH_PORT_OJ }} -H ${{ vars.DEV_SSH_HOST_OJ }} >> ~/.ssh/known_hosts

      - name: Login to the GitHub Packages Docker Registry
        run: ssh -p ${{ vars.DEV_SSH_PORT_OJ }} ${{ vars.DEV_SSH_USERNAME_OJ }}@${{ vars.DEV_SSH_HOST_OJ }} "echo ${{ secrets.DOCKER_REGISTRY_TOKEN }} | docker login ghcr.io -u ${{ vars.DOCKER_REGISTRY_USER }}" --password-stdin

      - name: Run docker-compose
        continue-on-error: true
        run: ssh -p ${{ vars.DEV_SSH_PORT_OJ }} ${{ vars.DEV_SSH_USERNAME_OJ }}@${{ vars.DEV_SSH_HOST_OJ }} "cd /var/www/admin-api && chmod +x deploy.sh && ./deploy.sh"

      - name: Delete unused images
        run: ssh -p ${{ vars.DEV_SSH_PORT_OJ }} ${{ vars.DEV_SSH_USERNAME_OJ }}@${{ vars.DEV_SSH_HOST_OJ }} "docker image prune -f"

      - name: Logout from the GitHub Packages Docker Registry
        run: ssh -p ${{ vars.DEV_SSH_PORT_OJ }} ${{ vars.DEV_SSH_USERNAME_OJ }}@${{ vars.DEV_SSH_HOST_OJ }} "docker logout ghcr.io"
